# Global
telegram_token: "your-telegram-bot-token-here"

# OpenRouter
openrouter_api_key: "your-openrouter-api-key-here"
openrouter_default_model: "anthropic/claude-sonnet-4"

# Maximum number of past messages kept in memory for get_recent_messages (default: 20)
conversation_window: 20

# Heartbeat interval for autonomous task processing (default: 90 minutes, 0 = disabled)
heartbeat_interval_minutes: 90

# MCP servers for additional tools (Model Context Protocol)
# mcp_servers:
#   - name: "my-server"
#     transport: "streamable"     # "streamable" (default) or "http"
#     url: "https://mcp.example.com/mcp"
#     api_key: "optional-bearer-token"

# DM access control
# dm_enabled: true   # unset (None): defaults to true if dms is empty, false if dms has entries
#                    # Some(true): respond to unknown DMs text-only
#                    # Some(false): block unknown DMs with "I don't know you" message

# Per-DM configuration overrides (keyed by user/chat ID, positive)
dms:
  # "123456789":
  #   model: "anthropic/claude-haiku-4"
  #   commands_enabled: true
  #   system_prompt: "You are talking to the bot owner."
  #   heartbeat_interval_minutes: 30
  #   bash_enabled: true

# Group-specific overrides (keyed by Telegram chat ID, negative)
chats:
  # "-1234567890":
  #   model: "openai/gpt-4o"
  #   interaction_mode: "every_message"    # "every_message" | "mention_only"
  #   interaction_whitelist: []            # user IDs; empty = everyone allowed
  #   commands_enabled: true               # whether bot commands are enabled
  #   system_prompt: ""                    # optional per-chat system prompt
  #   heartbeat_interval_minutes: 30       # optional, override global default; 0 = disabled
