# Global
telegram_token: "your-telegram-bot-token-here"

# OpenRouter
openrouter:
  api_key: "your-openrouter-api-key-here"
  model: "your-model-name-here"
  # Fallback models for media ingest — used when the conversation model doesn't
  # natively support the media type (image/audio). Only needed if you want
  # automatic conversion for non-vision/non-audio models.
  # image_fallback_model: "openai/gpt-4o"
  # audio_fallback_model: "google/gemini-2.5-flash"
  # Image generation model — when set, the `generate_image` tool is enabled.
  # Must be an image generation model (e.g. "google/imagen-4", "black-forest-labs/flux-1.1-pro").
  # image_gen_model: "black-forest-labs/flux-1.1-pro"
  # Embedding model for conversation vector search (RAG) — disabled by default.
  # When set, every message is embedded and stored. Example: "openai/text-embedding-3-small"
  # embedding_model: "openai/text-embedding-3-small"
  # Advice model for the ask_advisor tool — when set, the LLM can call a larger/smarter
  # model for advice. No default — tool is disabled when not configured.
  # advice_model: "openai/gpt-4o"

# Conversation context settings
conversation:
  recent_messages_window_size: 20    # number of recent messages loaded from DB as context (default: 20)
  # heartbeat_recent_messages_window_size: 10  # optional — number of recent messages loaded as context for heartbeat tasks; when unset falls back to recent_messages_window_size; set to 0 for no history (default: unset)
  advice_recent_messages_window_size: 5   # number of recent messages sent to advice model via ask_advisor (default: 5)
  # max_tool_result_chars: 8000       # optional — cap tool result length; results over this limit are replaced with an error asking the LLM to reduce the response (default: no limit)

# Embedding / vector search (RAG) settings
embedding:
  max_chars: 0                       # 0 = no limit (full text); otherwise truncate / split at this size
  allow_split: false                 # when true, split long text into chunks instead of truncating
  search_limit: 1000                 # max number of embeddings loaded for similarity search (default: 1000)

# Heartbeat for autonomous task processing
heartbeat_interval_minutes: 90       # per-chat interval in minutes (default: 90, 0 = disabled)
# Global bash tool toggle — used as fallback when no per-chat override is set
bash_enabled: true                   # (default: true)

# Directory where media files (images, videos, etc.) are stored,
# typically populated by MCP tools or bash downloads.
# The send_media and list_media tools reference this path.
# Telegram-ingested photos/audio are saved to <media_dir>/ingest/.
media_dir: "/media"                  # (default: /media)

# MCP servers for additional tools (Model Context Protocol)
# mcp_servers:
#   - name: "my-server"
#     transport: "streamable"       # "streamable" (default, session-based) or "http" (stateless)
#     url: "https://mcp.example.com/mcp"
#     api_key: "optional-bearer-token"

# Per-DM configuration overrides (keyed by user/chat ID, positive)
dms:
  # "123456789":
  #   name: "Alice"                    # optional, human-readable label (survives config updates)
  #   model: "anthropic/claude-haiku-4"
  #   commands_enabled: true
  #   system_prompt: "You are talking to the bot owner."
  #   heartbeat_interval_minutes: 30   # optional, override global default; 0 = disabled
  #   bash_enabled: true               # optional, override global bash_enabled
  #   image_fallback_model: "openai/gpt-4o"   # optional, override global image fallback model
  #   audio_fallback_model: "google/gemini-2.5-flash"  # optional, override global audio fallback model
  #   image_gen_model: "black-forest-labs/flux-1.1-pro"  # optional, override global image gen model
  #   advice_model: "openai/gpt-4o"          # optional, override global advice model

# Group-specific overrides (keyed by Telegram chat ID, negative)
chats:
  # "-1234567890":
  #   name: "Team Chat"                 # optional, human-readable label (survives config updates)
  #   model: "openai/gpt-4o"
  #   interaction_mode: "every_message"    # "every_message" | "mention_only"
  #   interaction_whitelist: []            # user IDs; empty = everyone allowed
  #   command_whitelist: []                # user IDs allowed to run commands; empty = nobody
  #   system_prompt: ""                    # optional per-chat system prompt
  #   heartbeat_interval_minutes: 30       # optional, override global default; 0 = disabled
  #   bash_enabled: true                   # optional, override global bash_enabled
  #   image_fallback_model: "openai/gpt-4o"  # optional, override global image fallback model
  #   audio_fallback_model: "google/gemini-2.5-flash"  # optional, override global audio fallback model
  #   image_gen_model: "black-forest-labs/flux-1.1-pro"  # optional, override global image gen model
  #   advice_model: "openai/gpt-4o"      # optional, override global advice model
  #   mcp_blacklist: []                    # optional, MCP server names to exclude for this chat (e.g. ["homeassistant"])
