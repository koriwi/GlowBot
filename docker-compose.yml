services:
  glowbot:
    build: .
    container_name: glowbot
    restart: unless-stopped
    volumes:
      - ./glowbot_data:/home/glowbot/glowbot_data
      # Uncomment after running `codex login` on the host when provider is codex.
      # Keep writable so GlowBot can persist refreshed OAuth tokens.
      # - ~/.codex:/home/glowbot/.codex
    environment:
      - GLOWBOT_DATA_DIR=/home/glowbot/glowbot_data
      - RUST_LOG=info
    # For git push in the data directory, mount SSH key:
    # volumes:
    #   - ~/.ssh:/home/glowbot/.ssh:ro
