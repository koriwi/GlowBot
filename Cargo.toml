[package]
name = "glowbot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.13", default-features = false, features = ["rustls", "ctrlc_handler"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
telegram-markdown-v2 = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
base64 = "0.22.1"
similar = "3.1.0"
schemars = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
mockall = "0.13"
wiremock = "0.6"
tempfile = "3"
